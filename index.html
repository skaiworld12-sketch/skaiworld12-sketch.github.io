<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>skylinesixteen</title>
  <meta name="description" content="Official links for skylinesixteen." />
  <meta property="og:title" content="skylinesixteen" />
  <meta property="og:description" content="Tap to follow on TikTok & Instagram." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://skaiworld12-sketch.github.io/" />
  <style>
    :root{
      --bg:#0f0f10;  /* background color (change this to your vibe) */
      --text:#fff;
      --accent:#fff;
      --shadow: rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      display:grid; place-items:center;
    }
    .wrap{ width:100%; max-width:720px; padding:24px; text-align:center; }
    h1{ margin:0 0 10px; font-size:clamp(28px,6vw,56px); letter-spacing:.5px; }
    p.tag{ margin:0 0 28px; opacity:.8; font-size:clamp(14px,2.8vw,18px); }
    .stack{ display:flex; flex-direction:column; gap:14px; align-items:center; }
    .btn{
      display:inline-block; text-decoration:none; color:var(--accent);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 16px 22px; border-radius: 16px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px var(--shadow);
      transition: transform .08s ease, opacity .2s ease, background .2s ease, border-color .2s ease;
      width:100%; max-width:560px; font-weight:700; letter-spacing:.2px;
    }
    .btn:hover{ transform: translateY(-1px); opacity:.95; }
    .btn:active{ transform: translateY(0); opacity:.9; }
    .btn.tiktok{ font-size:clamp(18px,3.8vw,22px); padding:18px 24px; }
    .btn.ig{ font-size:clamp(15px,3.2vw,18px); opacity:.9; }
    .foot{ margin-top:22px; opacity:.55; font-size:13px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Skai West</h1>
    <p class="tag">official links</p>

    <div class="stack">
      <!-- BIG TikTok button -->
      <a class="btn tiktok" 
         href="https://www.tiktok.com/@skylinesixteen" 
         target="_blank" rel="noopener">Follow on TikTok</a>

      <!-- Smaller Instagram button -->
      <a class="btn ig" 
         href="https://www.instagram.com/skylinesixteen" 
         target="_blank" rel="noopener">Instagram</a>
    </div>

    <div class="foot">© <span id="y"></span> skylinesixteen</div>
  </main>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
