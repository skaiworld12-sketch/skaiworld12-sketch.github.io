<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SKYLINESIXTEEN — v11.8</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#000; --text:#fff; --accent:#ff2b2b;
  --mag:#ff3fb3; --pur:#8c5bff; --blu:#6fafff; --grn:#58ffd1;
  --pulse:3.6s;
  --cursor-color:#ffffff; /* updated live via JS */
}
*{box-sizing:border-box;font-family:"Press Start 2P",monospace;image-rendering:pixelated}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);transition:background .6s ease,color .6s ease;cursor:none}

/* title */
.title{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;letter-spacing:2px;text-align:center}
.title .row{font-size:clamp(30px,7vw,82px);text-shadow:0 2px 0 #12121280,0 0 10px #ffffff10}
body.universe-theme .title .row{
  background:linear-gradient(120deg,var(--mag),var(--pur),var(--blu),var(--grn));
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none
}

/* pages & back */
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:22px;text-align:center}
.hidden{display:none}
.back-top{position:fixed;top:12px;left:12px;z-index:95;background:#000;border:2px solid var(--accent);
  color:var(--accent);font-size:12px;letter-spacing:1px;padding:8px 12px;transition:transform .12s,opacity .12s,color .3s,border-color .3s}
.back-top:hover{transform:translateY(-2px);opacity:.95}
body.universe-theme .back-top{color:var(--mag);border-color:var(--mag)}
.back-top{display:none}
body.has-back .back-top{display:inline-block}

/* ===== Video-game cursor (8-bit arrow) ===== */
.cursor{
  position:fixed;z-index:9999;pointer-events:none;
  width:34px;height:34px;translate:-4px -4px;
  background:var(--cursor-color);
  /* Pixel arrow mask */
  mask:url('data:image/svg+xml;utf8,\
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">\
    <path fill=\"black\" d=\"M2 2h6v2h2v2h2v2h2v2h2v2h2v2h2v2h-4v4h-2v-4h-2v-2h-2v-2H8v-2H6v-2H4V4H2z\"/>\
  </svg>') center/contain no-repeat;
  -webkit-mask:url('data:image/svg+xml;utf8,\
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">\
    <path fill=\"black\" d=\"M2 2h6v2h2v2h2v2h2v2h2v2h2v2h2v2h-4v4h-2v-4h-2v-2h-2v-2H8v-2H6v-2H4V4H2z\"/>\
  </svg>') center/contain no-repeat;
  filter:drop-shadow(2px 2px 0 #000);
  transition:background-color .15s linear,width .08s,height .08s, transform .08s;
}
.cursor.near{ transform:translate(-4px,-4px) scale(1.06); }

/* ENTER button */
.enter{background:transparent;border:0;color:var(--accent);font-size:clamp(18px,5vw,28px);padding:8px 12px;letter-spacing:2px;animation:enterBreathe var(--pulse) ease-in-out infinite}
@keyframes enterBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.enter:hover{transform:translateY(-2px) scale(1.02)}

/* MENU */
.menu-top{margin-top:84px;display:flex;flex-direction:column;gap:16px;align-items:center}
.btn{background:#000;border:4px solid var(--accent);color:var(--accent);padding:12px 18px;font-size:12px;letter-spacing:1px;text-decoration:none;display:inline-block}

/* Floating pixel islands + pixel speech bubble */
.islands{position:absolute;inset:0;z-index:0;pointer-events:none}
.island{position:absolute;bottom:12vh;left:50%;width:min(80vw,900px);transform:translateX(-50%);filter:contrast(120%) saturate(110%);image-rendering:pixelated;animation:float 5.5s ease-in-out infinite}
.island.small{bottom:22vh;left:20%;width:min(38vw,420px);animation-duration:6.3s;animation-delay:.3s;opacity:.9}
.island.tiny{bottom:28vh;left:74%;width:min(30vw,320px);animation-duration:7s;animation-delay:.6s;opacity:.85}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}50%{transform:translateX(-50%) translateY(-10px) scale(1.02)}}
.island-wrap{position:absolute;inset:0;z-index:1;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}

/* PIXEL speech bubble (hidden by default; only on UNIVERSE hover) */
.bubble{
  position:absolute;bottom:calc(12vh + 190px);left:50%;transform:translateX(-50%);
  padding:8px 10px;background:#111;color:#fff;font-size:10px;letter-spacing:1px;
  box-shadow:0 0 0 3px #fff, 0 0 0 6px #000;
  display:none;
}
.bubble:before,.bubble:after{
  content:"";position:absolute;width:10px;height:10px;bottom:-10px;left:50%;transform:translateX(-50%);
}
.bubble:before{background:#fff;}
.bubble:after{background:#000;transform:translateX(-50%) translateY(2px);}
body.menu-bubble .bubble{display:block}

/* UNIVERSE trigger */
.uni-wrap{position:relative;margin-top:min(22vh,180px)}
.uni{background:transparent;border:0;font-size:clamp(18px,4.4vw,26px);padding:12px 16px;letter-spacing:2px;color:var(--pur);animation:uniBreathe var(--pulse) ease-in-out infinite;transition:transform .12s}
@keyframes uniBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
/* Bigger on hover */
.uni:hover{transform:translateY(-2px) scale(1.20)}
.uni.morph{background:linear-gradient(130deg,var(--mag),var(--pur),var(--blu),var(--grn));-webkit-background-clip:text;background-clip:text;color:transparent}
.uni-stars{position:absolute;left:-20vw;right:-20vw;top:-24vh;height:58vh;pointer-events:none;z-index:-3;overflow:hidden}
.starBelt{position:absolute;left:-10%;width:120%;height:100%;top:0;
  background:
    radial-gradient(2px 2px at 10% 20%, var(--pur), #0000 70%),
    radial-gradient(2px 2px at 25% 50%, var(--grn), #0000 70%),
    radial-gradient(2px 2px at 40% 30%, var(--blu), #0000 70%),
    radial-gradient(2px 2px at 55% 60%, var(--mag), #0000 70%),
    radial-gradient(2px 2px at 70% 40%, var(--pur), #0000 70%),
    radial-gradient(2px 2px at 85% 65%, var(--grn), #0000 70%),
    radial-gradient(2px 2px at 95% 25%, var(--blu), #0000 70%);
  animation:beltDrift 22s linear infinite}
.starBelt.b2{animation-duration:28s;opacity:.7}.starBelt.b3{animation-duration:36s;opacity:.5}
@keyframes beltDrift{to{transform:translateX(-15%)}}
.uni:before{
  content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:min(30vw,304px);height:min(30vw,304px);border-radius:50%;
  background:
    conic-gradient(from 0deg,#0000 0 14%,rgba(168,140,255,.22) 14% 22%,#0000 22% 36%,rgba(102,255,214,.2) 36% 44%,#0000 44% 60%,rgba(111,175,255,.2) 60% 70%,#0000 70% 84%,rgba(255,63,179,.2) 84% 92%,#0000 92% 100%),
    radial-gradient(130px 70px at 50% 50%, rgba(126,99,255,.32), transparent 70%);
  filter:blur(10px) saturate(1.05);animation:swirl 18s linear infinite;z-index:-2}
@keyframes swirl{to{transform:rotate(360deg)}}

/* generic twinkles */
.tw-wrap{position:absolute;inset:0;pointer-events:none;z-index:0}
.tw{position:absolute;width:2px;height:2px;background:#fff;opacity:.55;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.7)}50%{transform:scale(1.4);opacity:1}}

/* UNIVERSE page bg + stars + travel FX */
body.universe-theme #universe{
  background:
    radial-gradient(1200px 800px at var(--rx,50%) var(--ry,50%), rgba(140,91,255,.14), transparent 60%),
    radial-gradient(800px 600px at calc(100% - var(--rx,50%)) calc(100% - var(--ry,50%)), rgba(111,175,255,.12), transparent 65%),
    linear-gradient(170deg,#0b0024,#220046 55%,#001a4d);
  transition:background 300ms ease}
.bg-stars{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-stars .dot{position:absolute;width:2px;height:2px;background:#ffffffaa;opacity:.75;animation:twinkle 2.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.4);opacity:.9}}
.warp{position:absolute;inset:-30%;pointer-events:none;opacity:0;z-index:0}
.warp.play{animation:warpIn 2.1s cubic-bezier(.15,.85,.1,1) forwards}
@keyframes warpIn{0%{opacity:0;transform:scale(.2) rotate(0);filter:blur(38px)}
40%{opacity:1;transform:scale(1.9) rotate(160deg);filter:blur(12px)}
70%{opacity:.9;transform:scale(1.2) rotate(300deg);filter:blur(6px)}
100%{opacity:.7;transform:scale(1);filter:blur(0)}}
.streaks,.rings{position:absolute;inset:0;pointer-events:none;z-index:0}
.ring{position:absolute;left:50%;top:50%;width:10px;height:10px;border:2px solid rgba(168,140,255,.25);border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:ringOut 1.8s ease-out forwards}
@keyframes ringOut{to{transform:translate(-50%,-50%) scale(12);opacity:0}}

/* Universe icons + pages */
.pixel-grid{display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:center;margin-top:36px;z-index:3}
.pix-card{display:flex;flex-direction:column;align-items:center;gap:8px}
.pix-cap{font-size:11px;letter-spacing:1px}
.icon8{width:56px;height:56px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:4px;animation:iconBreath var(--pulse) ease-in-out infinite}
.icon8 div{width:100%;height:100%}
@keyframes iconBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.icon-media div{background:var(--blu)} .icon-media + .pix-cap{color:var(--blu)}
.icon-social div{background:var(--mag)} .icon-social + .pix-cap{color:var(--mag)}
.icon-music div{background:var(--grn)} .icon-music + .pix-cap{color:var(--grn)}
.icon-contact div{background:var(--pur)} .icon-contact + .pix-cap{color:var(--pur)}

/* ===== Right-side ONE play button (singular icon) ===== */
.aud-side{position:fixed;top:50%;transform:translateY(-50%);z-index:2}
.aud-right{right:14px;display:flex;flex-direction:column;align-items:center;gap:12px}

/* Single icon button */
.playOne{
  width:56px;height:56px;display:grid;place-items:center;
  background:#000;border:4px solid var(--mag);
  box-shadow:0 0 0 3px #000, 0 0 0 6px #222 inset;
}
.playOne::before{
  content:""; width:24px; height:26px; background:#fff;
  mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28"><path d="M6 3 L24 14 L6 25 Z" fill="black"/></svg>') center/contain no-repeat;
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28"><path d="M6 3 L24 14 L6 25 Z" fill="black"/></svg>') center/contain no-repeat;
}
.playOne.playing{ border-color:var(--grn); }

/* Landing plus icons */
.plus-field{position:absolute;inset:0;z-index:2;pointer-events:none}
.plus{position:absolute;width:22px;height:22px;display:grid;place-items:center;color:#fff;opacity:.85;
  animation:drift var(calc(6s + 6s*var(--rand))) linear infinite}
.plus span{font-size:18px;line-height:1}
@keyframes drift{
  0%{transform:translate(var(--xstart), var(--ystart)) rotate(0deg) scale(1)}
  50%{transform:translate(calc(var(--xstart) + var(--dx)), calc(var(--ystart) + var(--dy))) rotate(20deg) scale(1.08)}
  100%{transform:translate(var(--xstart), var(--ystart)) rotate(0deg) scale(1)}
}
.plus.bump{animation-duration:2.2s;opacity:1}

/* === WORKED WITH — Polaroid stack (scoped) === */
#worked .stack-wrap{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,minmax(180px, 260px));
  gap:28px;
  justify-content:center;
  margin-top:26px;
  z-index:2;
}
@media (max-width:900px){
  #worked .stack-wrap{ grid-template-columns:repeat(2,minmax(160px,1fr)); }
}
@media (max-width:560px){
  #worked .stack-wrap{ grid-template-columns:minmax(220px, 1fr); gap:22px; }
}
#worked .polaroid{
  position:relative;
  background:#f7f7f7;
  border:2px solid #000;
  padding:10px 10px 40px 10px;   /* extra bottom for caption strip */
  box-shadow:4px 4px 0 #000;
  transform:rotate(var(--rot, 0deg));
  transition:transform .12s ease, box-shadow .12s ease;
}
#worked .polaroid:hover{
  transform:rotate(0deg) translateY(-4px) scale(1.02);
  box-shadow:6px 6px 0 #000;
}
#worked .polaroid img{
  width:100%; height:auto; display:block; object-fit:cover;
  aspect-ratio: 3/4; image-rendering:auto;
}
#worked .tag{
  position:absolute; left:0; right:0; bottom:8px;
  text-align:center; font-size:11px; letter-spacing:1px;
  color:#000; opacity:.9;
}
</style>
</head>
<body>

<button class="back-top" id="backTop">BACK</button>

<div class="title">
  <div class="row">SKYLINE</div>
  <div class="row">SIXTEEN</div>
</div>

<!-- landing -->
<section class="page" id="landing">
  <div class="tw-wrap" id="tw1"></div>
  <div class="plus-field" id="plusField" aria-hidden="true"></div>
  <button class="enter" data-page="menu">ENTER</button>
</section>

<!-- menu -->
<section class="page hidden" id="menu">
  <div class="tw-wrap" id="tw2"></div>

  <div class="islands">
    <img src="assets/img/city.png" alt="" class="island" />
    <img src="assets/img/city.png" alt="" class="island small" />
    <img src="assets/img/city.png" alt="" class="island tiny" />
  </div>

  <div class="island-wrap">
    <div class="bubble">i created everything</div>

  <div class="menu-top">
    <a class="btn" data-page="worked">WORKED WITH</a>

    <div class="uni-wrap">
      <div class="uni-stars">
        <div class="starBelt b1"></div>
        <div class="starBelt b2"></div>
        <div class="starBelt b3"></div>
      </div>
      <button class="uni" id="uniBtn" data-page="universe">UNIVERSE</button>
    </div>
  </div>
</section>

<!-- worked with -->
<section class="page hidden" id="worked">
  <div class="tw-wrap" id="tw3"></div>
  <h2 style="color:var(--accent);margin-top:84px;font-size:14px;letter-spacing:1px">WORKED WITH</h2>

  <div class="stack-wrap">
    <!-- 1 -->
    <figure class="polaroid" style="--rot:-2.6deg">
      <img src="assets/img/worked/benjibluebills.jpeg" alt="benjibluebills"/>
      <figcaption class="tag">benjibluebills</figcaption>

    <!-- 2 -->
    <figure class="polaroid" style="--rot:1.8deg">
      <img src="assets/img/worked/1300saint.jpeg" alt="1300saint"/>
      <figcaption class="tag">1300saint</figcaption>
    </figure>

    <!-- 3 -->
    <figure class="polaroid" style="--rot:-1.2deg">
      <img src="assets/img/worked/midwxst.jpeg" alt="midwxst"/>
      <figcaption class="tag">midwxst</figcaption>
    </figure>

    <!-- 4 -->
    <figure class="polaroid" style="--rot:2.4deg">
      <img src="assets/img/worked/gunnr.jpeg" alt="gunnr"/>
      <figcaption class="tag">gunnr</figcaption>
    </figure>

    <!-- 5 -->
    <figure class="polaroid" style="--rot:-3.2deg">
      <img src="assets/img/worked/diorvsyou.jpeg" alt="diorvsyou"/>
      <figcaption class="tag">diorvsyou</figcaption>
    </figure>

    <!-- 6 -->
    <figure class="polaroid" style="--rot:1.4deg">
      <img src="assets/img/worked/yung-fazo.jpeg" alt="yung fazo"/>
      <figcaption class="tag">yung fazo</figcaption>
    </figure>

    <!-- 7 -->
    <figure class="polaroid" style="--rot:-1.8deg">
      <img src="assets/img/worked/dj-rennesy.jpeg" alt="dj rennesy"/>
      <figcaption class="tag">dj rennesy</figcaption>

    <!-- 8 -->
    <figure class="polaroid" style="--rot:2.8deg">
      <img src="assets/img/worked/dom-corleo.jpeg" alt="dom corleo"/>
      <figcaption class="tag">dom corleo</figcaption>
    </figure>
  </div>
</section>

<!-- universe -->
<section class="page hidden" id="universe">
  <div class="bg-stars" id="bgStars"></div>
  <div class="warp" id="warp"></div>
  <div class="streaks" id="streaks"></div>
  <div class="rings" id="rings"></div>

  <!-- RIGHT: single play icon -->
  <div class="aud-side aud-right">
    <button class="playOne" id="playOne" title="Play/Pause" aria-label="Play/Pause"></button>
  </div>

  <!-- icons -->
  <div class="pixel-grid">
    <div class="pix-card"><a class="icon8 icon-media" data-page="media"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></a><div class="pix-cap">MEDIA</div></div>
    <div class="pix-card"><a class="icon8 icon-social" data-page="social"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></a><div class="pix-cap">SOCIAL</div></div>
    <div class="pix-card"><a class="icon8 icon-music" data-page="music"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></a><div class="pix-cap">MUSIC</div></div>
    <div class="pix-card"><a class="icon8 icon-contact" data-page="contact"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></a><div class="pix-cap">CONTACT</div></div>
  </div>

  <audio id="audioRight" src="assets/audio/songB.wav"></audio>
</section>

<!-- media / social / music / contact -->
<section class="page hidden page-emph page-media" id="media"><div class="tw-wrap" id="tw5"></div><h2 style="color:var(--blu);margin-top:84px;font-size:14px;letter-spacing:1px">MEDIA</h2><p style="font-size:11px;opacity:.9;max-width:560px">Gallery coming soon.</p></section>
<section class="page hidden page-emph page-social" id="social"><div class="tw-wrap" id="tw6"></div><h2 style="color:var(--mag);margin-top:84px;font-size:14px;letter-spacing:1px">SOCIAL</h2><div style="display:flex;flex-direction:column;gap:14px;margin-top:10px"><a class="btn" href="https://www.tiktok.com/@skylinesixteen" target="_blank" rel="noopener">TikTok @skylinesixteen</a><a class="btn" href="https://www.instagram.com/skylinesixteen" target="_blank" rel="noopener">Instagram @skylinesixteen</a></div></section>
<section class="page hidden page-emph page-music" id="music"><div class="tw-wrap" id="tw7"></div><h2 style="color:var(--grn);margin-top:84px;font-size:14px;letter-spacing:1px">MUSIC</h2><div style="margin-top:12px;width:min(92vw,720px);text-align:left"><p style="font-size:11px">Song A</p><audio controls src="assets/audio/songA.mp3" style="width:100%"></audio><p style="font-size:11px;margin-top:10px">Song B</p><audio controls src="assets/audio/songB.wav" style="width:100%"></audio></div></section>
<section class="page hidden page-emph page-contact" id="contact"><div class="tw-wrap" id="tw8"></div><h2 style="color:var(--pur);margin-top:84px;font-size:14px;letter-spacing:1px">CONTACT</h2><p style="font-size:12px"><a href="mailto:noah@skylinesixteen.com" style="color:var(--pur);text-decoration:none">noah@skylinesixteen.com</a></p></section>

<!-- Cursor node -->
<div class="cursor" id="cursor"></div>

<script>
/* utils + router */
const qs=(s,sc=document)=>sc.querySelector(s), qsa=(s,sc=document)=>Array.from(sc.querySelectorAll(s));
const pages=['landing','menu','worked','universe','media','social','music','contact'].reduce((m,id)=>(m[id]=qs('#'+id),m),{});
const historyStack=[];
function current(){return Object.entries(pages).find(([,n])=>!n.classList.contains('hidden'))?.[0]||'landing';}
function updateBackVisibility(id){
  const hasBack = !(id==='landing' || id==='menu');
  document.body.classList.toggle('has-back', hasBack);
}
function show(id,push=true){
  const cur=current();
  if(push && cur!==id) historyStack.push(cur);
  Object.values(pages).forEach(n=>n.classList.add('hidden'));
  pages[id].classList.remove('hidden');
  document.body.classList.toggle('universe-theme', id==='universe');
  updateBackVisibility(id);
  if(id==='universe') enterUniverseFX();
}
function goBack(){ if(historyStack.length){ show(historyStack.pop(),false); } else { show('menu',false); } }
qs('#backTop').onclick=goBack;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-page]'); if(!t) return; show(t.dataset.page);
});
show('landing',false);

/* UNIVERSE bubble only on hover */
const uniBtn=qs('#uniBtn');
uniBtn.addEventListener('mouseenter',()=>document.body.classList.add('menu-bubble'));
uniBtn.addEventListener('mouseleave',()=>document.body.classList.remove('menu-bubble'));

/* twinkles */
function twinkles(containerId,count=90,color="#fff"){
  const wrap=qs('#'+containerId);
  for(let i=0;i<count;i++){
    const t=document.createElement('div'); t.className='tw';
    t.style.left=Math.random()*100+'%'; t.style.top=Math.random()*100+'%';
    t.style.animationDelay=(Math.random()*3)+'s'; t.style.background=color;
    t.style.opacity=(0.3+Math.random()*0.7).toFixed(2);
    wrap.appendChild(t);
  }
}
twinkles('tw1',120,'#ffffff'); twinkles('tw2',40,'#ffffff');
['tw3','tw5','tw6','tw7','tw8'].forEach(id=>twinkles(id,26));

/* stars */
(function(){
  const root=qs('#bgStars'); if(!root) return; const N=240;
  for(let i=0;i<N;i++){
    const d=document.createElement('div'); d.className='dot';
    d.style.left=(Math.random()*100)+'%'; d.style.top=(Math.random()*100)+'%';
    d.style.animationDelay=(Math.random()*2.8)+'s';
    root.appendChild(d);
  }
})();

/* travel FX */
function enterUniverseFX(){
  const warp=qs('#warp'); if(!warp) return;
  warp.classList.remove('play'); void warp.offsetWidth; warp.classList.add('play');

  const streaks=qs('#streaks'); streaks.innerHTML='';
  for(let i=0;i<180;i++){
    const s=document.createElement('div');
    s.style.position='absolute'; s.style.width='2px'; s.style.height='24px';
    s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
    s.style.background='linear-gradient(#fff,#fff0)'; s.style.opacity='.9'; s.style.filter='blur(.5px)';
    s.animate([{transform:'translate(0,0) scaleY(.2)',opacity:.3},{transform:'translate(900%,600%) scaleY(1.8)',opacity:0}],
      {duration:1200,fill:'forwards',delay:Math.random()*220});
    streaks.appendChild(s);
  }
  const rings=qs('#rings'); rings.innerHTML='';
  for(let i=0;i<6;i++){ const r=document.createElement('div'); r.className='ring'; r.style.animationDelay=(i*140)+'ms'; rings.appendChild(r); }
}

/* ===== Cursor proximity color gradient to UNIVERSE ===== */
const cursor=qs('#cursor');
function lerp(a,b,t){ return a+(b-a)*t; }
function hsl(h,s,l){ return `hsl(${h} ${s}% ${l}%)`; }
addEventListener('mousemove', e=>{
  // move cursor
  cursor.style.left=e.clientX+'px'; cursor.style.top=e.clientY+'px';

  // grow & color shift near UNIVERSE on the MENU page
  const onMenu=!pages.menu.classList.contains('hidden');
  if(onMenu && uniBtn){
    const r=uniBtn.getBoundingClientRect();
    const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
    const d=Math.hypot(dx,dy);
    const maxD=260; // influence radius
    const t=Math.max(0, Math.min(1, 1 - d/maxD)); // 0 far -> 1 close
    const hue=lerp(200, 320, t);  // bluish -> magenta/purple
    const light=lerp(92, 70, t);  // slightly darker when close
    document.documentElement.style.setProperty('--cursor-color', hsl(hue, 100, light));
    cursor.classList.toggle('near', t>0.05);
  }else{
    document.documentElement.style.setProperty('--cursor-color', '#ffffff');
    cursor.classList.remove('near');
  }

  // reactive bg focal point on universe page
  if(!pages.universe.classList.contains('hidden')){
    const rx=(e.clientX/window.innerWidth*100).toFixed(2)+'%';
    const ry=(e.clientY/window.innerHeight*100).toFixed(2)+'%';
    pages.universe.style.setProperty('--rx', rx); pages.universe.style.setProperty('--ry', ry);
  }
});

/* ===== Right-side single play icon ===== */
const aR=qs('#audioRight');
const playOne=qs('#playOne');
function setPlayingUI(on){ playOne.classList.toggle('playing', !!on); }
playOne.addEventListener('click', ()=>{
  if(aR.paused){ aR.play().catch(()=>{}); }
  else{ aR.pause(); }
});
aR.addEventListener('play', ()=>setPlayingUI(true));
aR.addEventListener('pause', ()=>setPlayingUI(false));

/* back visibility */
function current(){return Object.entries(pages).find(([,n])=>!n.classList.contains('hidden'))?.[0]||'landing';}
</script>
